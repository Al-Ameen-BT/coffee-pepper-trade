# ==============================================================================
# Nginx WAF & Reverse Proxy Configuration for Uzhunnungal Traders
# ==============================================================================

# 1. Rate Limiting Zones (stores ~160,000 IP states per 10MB zone)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 2. Block Known Malicious Bots, Vulnerability Scanners & Scrapers at Edge
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(sqlmap|nikto|wpscan|masscan|dirbuster|gobuster|acunetix|havij|nmap|shodan|censys|zgrab|openvas|nessus|semrushbot|dotbot|mj12bot|ahrefsbot) 1;
}

server_tokens off;

server {
    listen 80;
    server_name _;

    # Certbot ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # SSL Certificate and Key (managed by deploy script: Let's Encrypt or Self-Signed fallback)
    ssl_certificate /etc/ssl/certs/uzhunnungal-traders.crt;
    ssl_certificate_key /etc/ssl/private/uzhunnungal-traders.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # OCSP stapling is disabled for self-signed cert compatibility
    ssl_stapling off;
    ssl_stapling_verify off;

    # Instantly drop connections from known malicious scanner bots (zero-byte termination)
    if ($is_malicious_bot) {
        return 444;
    }

    # Enable gzip compression for faster frontend delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Buffer Overflow & Slowloris Attack Defenses
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # 3. Block Probe Access to Hidden Sensitive Files (.git, .env, .aws, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 4. Block Common Exploit / CMS Probes
    location ~* (wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|cgi-bin|eval-stdin\.php) {
        return 444;
    }

    # 5. Strict Rate Limiting on Authentication (stops brute force & credential stuffing)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # 6. General Reverse Proxy with Burst Tolerance
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
    }
}
