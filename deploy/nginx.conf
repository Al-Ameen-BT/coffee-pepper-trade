# ==============================================================================
# Nginx WAF & Reverse Proxy Configuration for Uzhunnungal Traders
# ==============================================================================

# 1. Rate Limiting Zones (stores ~160,000 IP states per 10MB zone)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# 2. Block Known Malicious Bots, Vulnerability Scanners & Scrapers at Edge
map $http_user_agent $is_malicious_bot {
    default 0;
    ~*(sqlmap|nikto|wpscan|masscan|dirbuster|gobuster|acunetix|havij|nmap|shodan|censys|zgrab|openvas|nessus|semrushbot|dotbot|mj12bot|ahrefsbot) 1;
}

server_tokens off;

# Only the local ngrok agent may supply the final client address. Nginx then
# replaces the forwarded chain before passing the request to Express.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

upstream app_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTPS Server (Port 3424) - SSL enabled
server {
    listen 3424 ssl;
    server_name _;

    # SSL Certificate and Key (managed by deploy script: Let's Encrypt or Self-Signed fallback)
    ssl_certificate /etc/ssl/certs/uzhunnungal-traders.crt;
    ssl_certificate_key /etc/ssl/private/uzhunnungal-traders.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # OCSP stapling is disabled for self-signed cert compatibility
    ssl_stapling off;
    ssl_stapling_verify off;

    # Drop connections from known malicious scanner bots
    if ($is_malicious_bot) {
        return 444;
    }

    # Enable gzip compression for faster frontend delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Buffer Overflow & Slowloris Attack Defenses
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Block Probe Access to Hidden Sensitive Files (.git, .env, .aws, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block Common Exploit / CMS Probes
    location ~* (wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|cgi-bin|eval-stdin\.php) {
        return 444;
    }

    # Rate Limiting on Authentication (stops brute force & credential stuffing)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # General Reverse Proxy with Burst Tolerance
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
    }
}
